name: 每日更新四引擎轮动看板

on:
  schedule:
    # UTC 11:00 = 北京时间 19:00, 周一至周五
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 拉取行情数据并生成看板
        run: |
          python fetch_sina.py
          python gen_html.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "auto: update 四引擎轮动看板 $(date +'%Y-%m-%d %H:%M')" || echo "no changes"
          git push
